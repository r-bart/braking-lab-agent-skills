name: Verify package

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/verify_package.py
      - run: python scripts/build_archive.py
      - run: cd dist && sha256sum -c SHA256SUMS
      - run: python tests/installer_smoke.py
      - run: sh -n install.sh
